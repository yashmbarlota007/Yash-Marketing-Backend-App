<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yash Marketing - Order Processing OS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js for Interactive Pie Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { 
            background-color: #0B1121; 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
        }
        
        .glass-panel { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        
        .hover-card { 
            transition: all 0.3s ease; 
        }
        
        .hover-card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); 
            border-color: rgba(99, 102, 241, 0.4); 
        }
        
        ::-webkit-scrollbar { 
            width: 6px; 
            height: 6px; 
        }
        
        ::-webkit-scrollbar-track { 
            background: #0B1121; 
        }
        
        ::-webkit-scrollbar-thumb { 
            background: #334155; 
            border-radius: 4px; 
        }
        
        .hide-scrollbar::-webkit-scrollbar { 
            display: none; 
        }
        
        .hide-scrollbar { 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }
        
        @keyframes slideDown { 
            from { 
                transform: translateY(-100%); 
                opacity: 0; 
            } 
            to { 
                transform: translateY(0); 
                opacity: 1; 
            } 
        }
        
        .toast-enter { 
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        
        .active-filter { 
            background: #4F46E5 !important; 
            border-color: #6366F1 !important; 
            color: white !important; 
            font-weight: bold; 
        }
        
        .text-wrap-custom { 
            word-wrap: break-word; 
            white-space: normal; 
        }

        .vip-corridor { 
            animation: pulse-red-glow 2s infinite; 
            border: 1px solid #ef4444 !important; 
        }
        
        @keyframes pulse-red-glow {
            0% { 
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); 
            }
            70% { 
                box-shadow: 0 0 15px 5px rgba(239, 68, 68, 0); 
            }
            100% { 
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); 
            }
        }

        /* EXACT A4 (4-STICKER) PRINT LAYOUT */
        @media print {
            body * { 
                display: none !important; 
            }
            #shippingLabelScreen, #shippingLabelScreen * { 
                display: block !important; 
            }
            
            @page { 
                size: A4; 
                margin: 0; 
            }
            
            #shippingLabelScreen {
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 210mm; 
                height: 297mm; 
                background: white !important; 
                color: black !important;
                display: grid !important; 
                grid-template-columns: 1fr 1fr; 
                grid-template-rows: 1fr 1fr; 
                box-sizing: border-box;
                padding: 10mm;
                gap: 10mm;
            }
            
            .sticker-label {
                border: 1px dashed #ccc; 
                padding: 5mm;
                box-sizing: border-box;
                width: 100%; 
                height: 100%;
                overflow: hidden;
            }

            .empty-sticker { 
                border: none; 
            }
        }
    </style>
</head>
<body class="min-h-screen p-2 md:p-6 lg:p-8 selection:bg-indigo-500 selection:text-white">

    <!-- =======================================================
         DEALER TRACKING SELF-SERVICE MODE
         ======================================================= -->
    <div id="trackingScreen" class="hidden max-w-md mx-auto mt-10 p-6 glass-panel rounded-2xl border-t-4 border-t-emerald-500 text-center shadow-2xl">
        <h1 class="text-3xl font-black text-white mb-2 tracking-tight">
            Live Order Tracker
        </h1>
        <p class="text-slate-400 text-sm mb-8 font-mono">
            Tracking ID: <span id="displayTrackId"></span>
        </p>
        
        <div id="trackingLoader" class="inline-block animate-spin w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full mx-auto mb-4"></div>
        
        <div id="trackingTimeline" class="text-left space-y-6 hidden pl-4 relative before:absolute before:inset-0 before:ml-[1.4rem] before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-700 before:to-transparent">
        </div>
        
        <div id="trackingError" class="hidden text-pink-500 font-bold mt-4"></div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="mainAppWrapper">

        <!-- Global Cmd+K Search Modal -->
        <div id="searchModal" class="hidden fixed inset-0 bg-[#0B1121]/90 backdrop-blur-md z-[200] flex items-start justify-center pt-20 px-4 transition-all">
            <div class="bg-[#131C31] w-full max-w-2xl rounded-2xl border border-indigo-500 shadow-[0_0_40px_rgba(79,70,229,0.3)] overflow-hidden flex flex-col">
                
                <div class="p-4 border-b border-slate-800 flex items-center gap-3">
                    <span class="text-indigo-400 text-xl">🔍</span>
                    <input 
                        type="text" 
                        id="searchInput" 
                        onkeyup="performSearch()" 
                        placeholder="Search Order ID, Dealer Name or Phone Number..." 
                        class="w-full bg-transparent text-white text-lg outline-none font-bold placeholder-slate-500"
                    >
                    <button 
                        onclick="closeSearch()" 
                        class="text-slate-500 text-xs border border-slate-700 px-2 py-1 rounded hover:bg-slate-800"
                    >
                        ESC
                    </button>
                </div>
                
                <div id="searchResults" class="max-h-[60vh] overflow-y-auto p-2 bg-[#0B1121] hide-scrollbar">
                    <div class="p-8 text-center text-slate-500 font-bold">
                        Start typing to search main database...
                    </div>
                </div>
                
            </div>
        </div>

        <!-- Shift Handover Modal -->
        <div id="handoverModal" class="hidden fixed inset-0 bg-[#0B1121]/90 backdrop-blur-md z-[200] flex items-center justify-center p-4 transition-all">
            <div class="bg-[#131C31] w-full max-w-lg rounded-2xl border border-indigo-500 shadow-[0_0_40px_rgba(79,70,229,0.3)] overflow-hidden flex flex-col">
                <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-[#0B1121]">
                    <h2 class="text-xl font-black text-white flex items-center gap-2">
                        <span class="text-indigo-400">📝</span> Shift Handover Notes
                    </h2>
                    <button onclick="closeHandover()" class="text-slate-500 hover:text-pink-400 text-2xl leading-none">&times;</button>
                </div>
                <div class="p-5">
                    <textarea id="handoverNoteInput" rows="4" class="w-full bg-[#0B1121] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder-slate-500 text-sm" placeholder="Enter critical updates, pending tasks, or issues for the next shift..."></textarea>
                    <button onclick="saveHandover()" id="btnSaveHandover" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-xl transition-all text-sm">
                        Submit Handover Note
                    </button>
                    
                    <h3 class="mt-6 mb-3 text-xs font-black text-slate-400 uppercase tracking-widest border-b border-slate-800 pb-2">Recent Shift Notes</h3>
                    <div id="handoverHistory" class="space-y-3 max-h-[30vh] overflow-y-auto hide-scrollbar">
                        <!-- History injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Notification Area -->
        <div id="notificationArea" class="fixed top-4 left-0 right-0 z-[100] flex flex-col items-center gap-2 pointer-events-none"></div>

        <!-- Dynamic Shipping Label Printable Area -->
        <div id="shippingLabelScreen" class="hidden"></div>

        <!-- Login Screen -->
        <div id="loginScreen" class="flex h-[90vh] items-center justify-center p-4">
            <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border-t-4 border-t-indigo-500">
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 mb-2 tracking-tight">
                    YASH MARKETING
                </h1>
                <p class="text-slate-400 text-xs tracking-[0.2em] mb-8 uppercase font-semibold">
                    Enterprise OS Login (v13.0.0)
                </p>
                
                <form id="loginForm" class="space-y-4">
                    <input 
                        type="text" 
                        id="loginEmpId" 
                        placeholder="Access Code / Emp ID" 
                        required 
                        class="w-full bg-[#131C31] border border-slate-700 rounded-xl p-3.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 uppercase transition-all shadow-inner"
                    >
                    <input 
                        type="password" 
                        id="loginPass" 
                        placeholder="Security PIN" 
                        required 
                        class="w-full bg-[#131C31] border border-slate-700 rounded-xl p-3.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all shadow-inner"
                    >
                    <button 
                        type="submit" 
                        id="loginBtn" 
                        class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(79,70,229,0.3)] transition-all transform active:scale-[0.98]"
                    >
                        INITIALIZE SYSTEM
                    </button>
                </form>
                
                <p id="loginError" class="text-pink-400 text-sm mt-4 font-semibold hidden animate-pulse"></p>
            </div>
        </div>

        <!-- Main Operational Dashboard Screen -->
        <div id="dashboardScreen" class="hidden max-w-[1400px] mx-auto pb-20">
            
            <!-- Top Navigation Bar -->
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-4 bg-[#131C31] p-4 rounded-2xl border border-slate-800 shadow-lg">
                
                <div class="w-full lg:w-1/3">
                    <h1 class="text-2xl font-black text-white flex items-center gap-2 tracking-tight">
                        <span class="text-indigo-400">⚡</span> Order Processing
                    </h1>
                    <p class="text-slate-400 text-xs mt-1 font-mono flex items-center">
                        OP_ID: <span id="userName" class="text-emerald-400 font-bold ml-1"></span>
                        <span id="backendEarningsBadge" class="ml-3 bg-emerald-900/30 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded text-[10px] hidden font-bold">💰 Earned Today: ₹0</span>
                    </p>
                </div>
                
                <div class="w-full lg:w-1/3">
                    <button 
                        onclick="openSearch()" 
                        class="w-full bg-[#0B1121] border border-slate-700 hover:border-indigo-500 text-slate-400 flex justify-between items-center px-4 py-2.5 rounded-xl transition-all shadow-inner group"
                    >
                        <span class="flex items-center gap-2 text-sm">
                            <span class="text-indigo-400">🔍</span> Search orders, dealers...
                        </span>
                        <span class="bg-slate-800 text-slate-400 text-[10px] font-bold px-2 py-1 rounded group-hover:text-white">
                            Cmd+K
                        </span>
                    </button>
                </div>

                <div class="flex flex-wrap items-center justify-end gap-1.5 w-full lg:w-3/5 bg-[#0B1121] p-1.5 rounded-xl border border-slate-800">
                    <button onclick="setDateRange('all', this)" class="date-filter-btn active-filter px-2.5 py-1.5 rounded-lg text-xs text-slate-400 hover:text-white hover:bg-slate-800 transition-all">All Time</button>
                    <button onclick="setDateRange('today', this)" class="date-filter-btn px-2.5 py-1.5 rounded-lg text-xs text-slate-400 hover:text-white hover:bg-slate-800 transition-all">Today</button>
                    <button onclick="setDateRange('yesterday', this)" class="date-filter-btn px-2.5 py-1.5 rounded-lg text-xs text-slate-400 hover:text-white hover:bg-slate-800 transition-all">Yesterday</button>
                    <button onclick="setDateRange('thisWeek', this)" class="date-filter-btn px-2.5 py-1.5 rounded-lg text-xs text-slate-400 hover:text-white hover:bg-slate-800 transition-all">This Week</button>
                    <button onclick="setDateRange('thisMonth', this)" class="date-filter-btn px-2.5 py-1.5 rounded-lg text-xs text-slate-400 hover:text-white hover:bg-slate-800 transition-all">This Month</button>
                    
                    <div class="w-px h-5 bg-slate-700 mx-1"></div>
                    
                    <button onclick="setDateRange('split', this)" class="date-filter-btn px-2.5 py-1.5 rounded-lg text-[10px] text-purple-400 border border-purple-500/30 hover:bg-purple-500 hover:text-white transition-all uppercase font-black tracking-widest">
                        ✂️ Split
                    </button>
                    
                    <button onclick="openHandover()" class="ml-1 bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 hover:bg-yellow-500 hover:text-black px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1">
                        📝 NOTES
                    </button>
                    
                    <button onclick="generateEODReport()" class="ml-1 bg-blue-500/10 text-blue-400 border border-blue-500/30 hover:bg-blue-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1">
                        📊 EOD
                    </button>
                    
                    <button onclick="logout()" class="ml-1 bg-pink-500/10 text-pink-400 border border-pink-500/30 hover:bg-pink-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all">
                        LOGOUT
                    </button>
                </div>
            </div>
            
            <!-- Command Center -->
            <div id="mdoCommandCenter" class="hidden mb-8 space-y-4"></div>

            <h3 class="text-lg font-black text-white mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
                <span class="text-indigo-400">🌊</span> Operational Pipeline
            </h3>
            
            <div id="stageFilterBar" class="flex overflow-x-auto gap-3 mb-6 pb-2 hide-scrollbar snap-x snap-mandatory w-full"></div>
            
            <div id="orderGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
        </div>
    </div> <!-- End Main App Wrapper -->

    <!-- Order Execution Task Modal -->
    <div id="orderModal" class="hidden fixed inset-0 bg-[#0B1121]/95 backdrop-blur-md flex items-center justify-center z-50 p-2 sm:p-4 transition-all">
        <div class="glass-panel w-full max-w-3xl rounded-2xl overflow-hidden flex flex-col max-h-[95vh] shadow-2xl border border-slate-700">
            
            <div class="p-5 border-b border-slate-700 flex justify-between items-center bg-[#131C31] shadow-md z-10">
                <div>
                    <h2 class="text-2xl font-black text-white tracking-tight flex items-center gap-3">
                        <span id="modalOrderId">ORD-000</span>
                        <span 
                            id="modalVipBadge" 
                            class="hidden bg-red-500 text-white text-[9px] px-2 py-0.5 rounded font-black uppercase shadow-[0_0_10px_red] animate-pulse"
                        >
                            🔥 VIP
                        </span>
                    </h2>
                    
                    <p class="text-indigo-400 text-sm font-bold mt-1 text-wrap-custom flex items-center gap-2" id="modalShopName">
                        Shop Name
                    </p>
                    
                    <div class="flex gap-2 mt-2 items-center flex-wrap">
                        <span 
                            id="modalPaymentMode" 
                            class="text-[10px] bg-slate-800 px-2 py-1 rounded text-white font-black tracking-widest uppercase"
                        ></span>
                        <span 
                            id="modalTotalValue" 
                            class="text-[10px] bg-emerald-900/30 border border-emerald-500/30 px-2 py-1 rounded text-emerald-400 font-black tracking-widest"
                        ></span>
                    </div>
                    
                    <div class="flex gap-2 mt-2 items-center flex-wrap">
                        <span 
                            id="modalReceiptDate" 
                            class="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-300 font-mono tracking-widest border border-slate-700"
                        ></span>
                        <span 
                            id="modalTimeElapsed" 
                            class="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-300 font-black tracking-widest border border-slate-700"
                        ></span>
                        <span id="modalTatTimer" class="hidden"></span>
                    </div>
                </div>
                
                <button 
                    onclick="closeModal()" 
                    class="text-slate-400 hover:text-pink-400 text-4xl leading-none transition-colors"
                >
                    &times;
                </button>
            </div>
            
            <div class="p-4 md:p-6 overflow-y-auto flex-grow bg-[#0B1121]" id="stagesContainer">
                <!-- Dynamically Generated Stages Here -->
            </div>
        </div>
    </div>

    <!-- ============================================================================== -->
    <!-- MAIN JAVASCRIPT LOGIC START                                                    -->
    <!-- ============================================================================== -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzQ7W09dn_1gyNSq_PCPrKLX6ApgB52Ob2_1BnmRe5SdYTMNyc8kRwudr80pe2QFCQZCg/exec"; 
        
        const STAGE_NAMES = [
            "Order Received", 
            "Balance Check", 
            "WhatsApp 1 (Confirmation)", 
            "Processed (Stock)", 
            "Invoiced", 
            "Dispatched", 
            "Logistics Allocation", 
            "Delivery Comms (Call/WA)", 
            "Delivered", 
            "Final Call (Rating)"
        ];

        window.appData = { 
            rawArray: [], 
            orders: {} 
        };
        
        window.appSettings = {};

        let filteredData = [];
        let currentActiveOrder = null;
        
        let activeStageFilter = 0; 
        let activeDateRange = 'all'; 
        
        let autoRefreshInterval = null;
        let queuedFiles = []; 
        let currentUserRole = 'Staff';
        let currentUserName = ''; 
        let brandChartInstance = null; 

        // =======================================================
        // PERSISTENT SESSION & ROUTING LOGIC
        // =======================================================
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const trackId = urlParams.get('track');
            const portalEmpId = urlParams.get('empId');

            if (trackId) {
                // DEALER TRACKING VIEW
                document.getElementById('mainAppWrapper').classList.add('hidden');
                document.getElementById('trackingScreen').classList.remove('hidden');
                document.getElementById('displayTrackId').innerText = trackId;
                
                runTrackerMode(trackId);
            } else {
                // STAFF OS VIEW
                const savedUser = localStorage.getItem('yash_user');
                const savedRole = localStorage.getItem('yash_role');
                
                if (savedUser && savedUser.trim() !== "") {
                    showDashboard(savedUser, savedRole);
                } 
                else if (portalEmpId && portalEmpId.trim() !== "") {
                    document.getElementById('loginEmpId').value = portalEmpId;
                    document.getElementById('loginPass').value = "SSO_BYPASS";
                    const btn = document.getElementById('loginBtn');
                    btn.innerText = "AUTHENTICATING SSO...";
                    
                    fetch(API_URL, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ 
                            action: 'login', 
                            employeeId: portalEmpId, 
                            password: 'SSO_BYPASS' 
                        }) 
                    })
                    .then(res => res.text())
                    .then(text => JSON.parse(text))
                    .then(data => {
                        if (data.status === 'success' || data.success === true) {
                            const uName = data.user?.name || data.username;
                            const uRole = data.user?.role || data.role || 'Staff';
                            
                            localStorage.setItem('yash_user', uName);
                            localStorage.setItem('yash_role', uRole);
                            
                            showDashboard(uName, uRole);
                        } else {
                            document.getElementById('loginError').innerText = "SSO Failed: " + (data.message || "Invalid Access");
                            document.getElementById('loginError').classList.remove('hidden');
                            btn.innerText = "INITIALIZE SYSTEM";
                        }
                    })
                    .catch(err => {
                        document.getElementById('loginError').innerText = "Network error during SSO login. Please login manually.";
                        document.getElementById('loginError').classList.remove('hidden');
                        btn.innerText = "INITIALIZE SYSTEM";
                    });
                }
            }
            
            // Start Global TAT Timer Tick
            setInterval(updateTatTimers, 1000);
        });

        function updateTatTimers() {
            document.querySelectorAll('.tat-timer').forEach(el => {
                let target = parseInt(el.getAttribute('data-target'));
                let now = new Date().getTime();
                let diff = target - now;
                
                if (diff > 0) {
                    let mins = Math.floor(diff / 60000);
                    let secs = Math.floor((diff % 60000) / 1000);
                    el.innerText = `⏳ TAT: ${mins}m ${secs}s`;
                    el.className = "tat-timer bg-orange-900/30 text-orange-400 text-[10px] px-2 py-1 rounded font-black border border-orange-500/30 shrink-0 animate-pulse";
                } else {
                    let minsOver = Math.abs(Math.floor(diff / 60000));
                    el.innerText = `🚨 LATE: ${minsOver}m OVER`;
                    el.className = "tat-timer bg-red-600 text-white text-[10px] px-2 py-1 rounded font-black border border-red-800 shrink-0 animate-bounce";
                }
            });
        }

        function runTrackerMode(trackId) {
            fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify({
                    action: 'getTrackingData', 
                    orderId: trackId
                }) 
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('trackingLoader').style.display = 'none';
                if(data.status === 'success') {
                    let html = '';
                    const customerStages = [
                        "Order Placed", 
                        "Confirmed & Processing", 
                        "Packed & Ready", 
                        "Invoiced", 
                        "Dispatched", 
                        "Out for Delivery", 
                        "Delivered Successfully"
                    ];
                    
                    let mappedStage = Math.min(Math.floor(data.data.completedStages / 1.5), 6);
                    
                    customerStages.forEach((stageName, idx) => {
                        let isCompleted = idx <= mappedStage;
                        let isActive = idx === mappedStage;
                        let color = isCompleted ? 'bg-emerald-500 shadow-[0_0_10px_#10b981]' : 'bg-slate-700';
                        let textColor = isCompleted ? 'text-white' : 'text-slate-500';
                        
                        let icon = "";
                        if (isCompleted) {
                            icon = '✓';
                        } else if (isActive && idx !== 6) {
                            icon = '⏳';
                        }
                        
                        html += `
                            <div class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                                <div class="flex items-center justify-center w-8 h-8 rounded-full border-4 border-[#0B1121] ${color} text-white font-black text-xs z-10 shrink-0">
                                    ${icon}
                                </div>
                                <div class="w-[calc(100%-3rem)] md:w-[calc(50%-2.5rem)] p-4 rounded-xl border ${isCompleted ? 'border-emerald-500/30 bg-emerald-900/10' : 'border-slate-800 bg-[#131C31]'} shadow">
                                    <h3 class="font-bold text-sm ${textColor}">
                                        ${stageName}
                                    </h3>
                                </div>
                            </div>
                        `;
                    });
                    
                    document.getElementById('trackingTimeline').innerHTML = html;
                    document.getElementById('trackingTimeline').classList.remove('hidden');
                } else {
                    document.getElementById('trackingError').innerText = data.message || "Invalid Tracking ID";
                    document.getElementById('trackingError').classList.remove('hidden');
                }
            })
            .catch(err => {
                document.getElementById('trackingLoader').style.display = 'none';
                document.getElementById('trackingError').innerText = "Network error while fetching tracking data.";
                document.getElementById('trackingError').classList.remove('hidden');
            });
        }

        // CMD+K SEARCH LOGIC
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') { 
                e.preventDefault(); 
                openSearch(); 
            }
            if (e.key === 'Escape') {
                closeSearch();
            }
        });

        function openSearch() { 
            document.getElementById('searchModal').classList.remove('hidden'); 
            document.getElementById('searchInput').focus(); 
        }
        
        function closeSearch() { 
            document.getElementById('searchModal').classList.add('hidden'); 
            document.getElementById('searchInput').value = '';

        // DATE PARSERS & HELPERS
        function parseCustomDate(dateStr) {
            if (!dateStr) {
                return new Date();
            }
            let d = new Date(dateStr);
            if (!isNaN(d)) {
                return d;
            }
            
            let parts = String(dateStr).split(' ');
            if (parts.length >= 1) {
                let dateParts = parts[0].split(/[\/\-]/);
                if (dateParts.length === 3) {
                    let day = parseInt(dateParts[0]);
                    let month = parseInt(dateParts[1]) - 1;
                    let year = parseInt(dateParts[2]);
                    
                    if (year < 100) {
                        year += 2000;
                    }
                    
                    let hours = 0, mins = 0, secs = 0;
                    if (parts.length >= 2) {
                        let timeParts = parts[1].split(':');
                        hours = parseInt(timeParts[0]) || 0; 
                        mins = parseInt(timeParts[1]) || 0; 
                        secs = parseInt(timeParts[2]) || 0;
                    }
                    return new Date(year, month, day, hours, mins, secs);
                }
            }
            return new Date();
        }

        function formatExactDate(dateString) {
            if (!dateString) {
                return "";
            }
            const d = parseCustomDate(dateString);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            
            let hours = d.getHours(); 
            const ampm = hours >= 12 ? 'PM' : 'AM'; 
            
            hours = hours % 12; 
            hours = hours ? hours : 12; 
            
            const mins = String(d.getMinutes()).padStart(2, '0');
            return `Received: ${day}/${month}/${year} ${hours}:${mins} ${ampm}`;
        }

        function getTimeAgoUI(dateString) {
            if (!dateString) {
                return { text: "", color: "text-slate-400", isSLAWarning: false };
            }
            
            const orderDate = parseCustomDate(dateString);
            const diffInMs = new Date() - orderDate;
            
            if (diffInMs < 0) {
                return { text: "Just now", color: "text-emerald-400", isSLAWarning: false };
            }
            
            const diffInHrs = Math.floor(diffInMs / (1000 * 60 * 60));
            const diffInMins = Math.floor((diffInMs % (1000 * 60 * 60)) / (1000 * 60));
            
            let color = 'text-emerald-400';
            let isSLAWarning = false;
            
            if (diffInHrs >= 48) {
                color = 'text-pink-500';
            } else if (diffInHrs >= 46) { 
                color = 'text-yellow-400'; 
                isSLAWarning = true; 
            } else if (diffInHrs >= 4) {
                color = 'text-orange-400';
            }

            if (diffInHrs > 48) {
                return { text: `${Math.floor(diffInHrs/24)}d ago`, color, isSLAWarning };
            }
            if (diffInHrs > 0) {
                return { text: `${diffInHrs}h ${diffInMins}m ago`, color, isSLAWarning };
            }
            if (diffInMins > 0) {
                return { text: `${diffInMins}m ago`, color, isSLAWarning };
            }
            return { text: `Just now`, color, isSLAWarning };
        }

        function makeDirectDriveLink(url) {
            let match = url.match(/\/d\/(.*?)\//);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        function applyDateFilter() {
            let now = new Date(); 
            now.setHours(0,0,0,0);

            let today = new Date(now);
            let yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1);
            
            let dayOfWeek = now.getDay();
            let diffToMonday = now.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            let startOfThisWeek = new Date(now); startOfThisWeek.setDate(diffToMonday);
            
            let startOfLastWeek = new Date(startOfThisWeek); startOfLastWeek.setDate(startOfLastWeek.getDate() - 7);
            let endOfLastWeek = new Date(startOfThisWeek); endOfLastWeek.setDate(endOfLastWeek.getDate() - 1);
            
            let startOfThisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            let startOfLastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            let endOfLastMonth = new Date(now.getFullYear(), now.getMonth(), 0);

            if (activeDateRange === 'split') {
                filteredData = window.appData.rawArray.filter(o => String(o.orderId).toUpperCase().includes('SPLIT'));
            } else if (activeDateRange === 'all') {
                filteredData = window.appData.rawArray;
            } else {
                filteredData = window.appData.rawArray.filter(o => {
                    let d = parseCustomDate(o.date); 
                    d.setHours(0,0,0,0);
                    
                    if (activeDateRange === 'today') return d.getTime() === today.getTime();
                    if (activeDateRange === 'yesterday') return d.getTime() === yesterday.getTime();
                    if (activeDateRange === 'thisWeek') return d >= startOfThisWeek && d <= now;
                    if (activeDateRange === 'lastWeek') return d >= startOfLastWeek && d <= endOfLastWeek;
                    if (activeDateRange === 'thisMonth') return d >= startOfThisMonth && d <= now;
                    if (activeDateRange === 'lastMonth') return d >= startOfLastMonth && d <= endOfLastMonth;
                    
                    return true;
                });
            }
            renderMdoDashboard(); 
            renderPipeline();
        }

        async function executeUnblock(orderId) {
            if(!confirm("Warning: You are bypassing the system Credit Lock for this dealer. Proceed?")) return;
            try {
                let res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'unblockOrder', orderId: orderId })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    showNotification("OVERRIDE SUCCESS", "Order Unlocked.");
                    fetchOrders(true);
                } else alert("Failed to unblock order.");
            } catch(e) { alert("Network error."); }
        }

        // 1-CLICK MERGE EXECUTION
        // ✅ Added targetBtn to the function arguments below
        async function executeMerge(primaryOrderId, shopName, targetBtn) {
            if(!confirm(`Combine all pending items for ${shopName} into this order?`)) return;
            
            targetBtn.innerText = "Merging Pipelines...";
            targetBtn.disabled = true;
            targetBtn.classList.add('animate-pulse');
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'mergeOrders',
                        primaryOrderId: primaryOrderId,
                        shopName: shopName
                    })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    showNotification("MERGE COMPLETE", "Orders have been physically combined in the database.");
                    closeModal();
                    fetchOrders(true);
                } else {
                    alert(data.message);
                    targetBtn.innerText = "Merge Failed";
                }
            } catch(e) {
                alert("Network error during merge execution.");
                targetBtn.innerText = "Retry Merge";
                targetBtn.disabled = false;
            }
        }

                            previewBox.innerHTML += `
                                <div class="w-12 h-12 bg-indigo-900/50 flex flex-col items-center justify-center rounded border border-indigo-500 text-[8px] text-indigo-300 font-bold p-1 overflow-hidden shadow-inner">
                                    🎤<br/>Audio
                                </div>
                            `; 
                        } else { 
                            const reader = new FileReader(); 
                            reader.onload = function(e) { 
                                previewBox.innerHTML += `
                                    <img src="${e.target.result}" class="w-12 h-12 object-cover rounded border border-slate-600 shadow-sm">
                                `; 
                            }; 
                            reader.readAsDataURL(file); 
                        }
                    });
                }
            }
        }
        
        function clearQueuedFiles(stageNum) {
            queuedFiles = [];
            
            if (document.getElementById(`fileStatusText_${stageNum}`)) {
                document.getElementById(`fileStatusText_${stageNum}`).classList.add('hidden'); 
            }
            if (document.getElementById(`clearFilesBtn_${stageNum}`)) {
                document.getElementById(`clearFilesBtn_${stageNum}`).classList.add('hidden'); 
            }
            if (document.getElementById(`fileStatusContainer_${stageNum}`)) {
                document.getElementById(`fileStatusContainer_${stageNum}`).classList.add('hidden');
            }
            if (document.getElementById(`previewBox_${stageNum}`)) { 
                document.getElementById(`previewBox_${stageNum}`).innerHTML = ''; 
                document.getElementById(`previewBox_${stageNum}`).classList.add('hidden'); 
            }
        }
        
        window.shareToGroup = function(stageNum, fileUrlsString) {
            const orderId = currentActiveOrder.orderId; 
            const shop = currentActiveOrder.shopName; 
            const stageName = STAGE_NAMES[stageNum - 1]; 
            
            let links = fileUrlsString.split(',').map(u => makeDirectDriveLink(u.trim())).join('\n');
            let msg = `*Order Update Alert*\n\n*Order ID:* ${orderId}\n*Dealer:* ${shop}\n*Stage Update:* ${stageName}\n\n*Attached Files/Proof:*\n${links}`;
            
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
            
            localStorage.setItem('shared_' + orderId + '_' + stageNum, 'true');
            setTimeout(() => { openModal(orderId); }, 1000);
        }

        function generateEODReport() {
            if (!window.appData || !window.appData.rawArray || window.appData.rawArray.length === 0) {
                alert("No data available to generate report.");
                return;
            }
            
            let today = new Date();
            today.setHours(0,0,0,0);
            
            let todayOrders = window.appData.rawArray.filter(o => {
                let d = parseCustomDate(o.date);
                d.setHours(0,0,0,0);
                return d.getTime() === today.getTime();
            });
            
            let totalReceived = todayOrders.length;
            let totalValue = todayOrders.reduce((sum, o) => sum + (o.totalValue || 0), 0);
            let totalCompleted = todayOrders.filter(o => o.isFullyCompleted).length;
            let totalDispatched = todayOrders.filter(o => o.completedStages >= 6 && !o.isFullyCompleted).length;
            let pending = totalReceived - totalCompleted - totalDispatched;
            
            let reportDate = new Date().toLocaleDateString('en-GB');
            let staffName = currentUserName ? currentUserName.toUpperCase() : 'ADMIN';
            
            let msg = `*📊 DAILY EOD REPORT - YASH MARKETING*\n\n*📅 Date:* ${reportDate}\n*🧑‍💼 Staff:* ${staffName}\n\n`;
            msg += `*📦 Orders Received Today:* ${totalReceived}\n`;
            msg += `*💰 Total Value:* ₹${totalValue.toLocaleString()}\n`;
            msg += `*✅ Orders Delivered/Final:* ${totalCompleted}\n`;
            msg += `*🚚 Orders Dispatched:* ${totalDispatched}\n`;
            msg += `*⏳ Pending Orders:* ${pending}\n\n`;
            msg += `_System Generated via MDO OS_`;
            
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function generateTallyCSV(orderId) {
            const order = window.appData.orders[orderId];
            if(!order) {
                return;
            }
            
            let csvContent = "\uFEFFDate,Voucher Type,Voucher Number,Party Name,Item Name,Quantity,Rate,Amount\n";
            let formattedDate = parseCustomDate(order.date).toLocaleDateString('en-GB'); 
            
            order.items.forEach(item => { 
                csvContent += `${formattedDate},Sales Order,${order.orderId},"${order.shopName}","${item.name}",${item.qty},0,0\n`; 
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            
            link.href = URL.createObjectURL(blob);
            link.download = `Tally_SO_${order.orderId}.csv`;
            link.style.display = 'none';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showNotification("Tally SO Exported", `Ensure file is CLOSED before importing in Tally.`);
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                
                reader.onload = (event) => {
                    const img = new Image(); 
                    img.src = event.target.result;
                    
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); 
                        const MAX_WIDTH = 500; 
                        let scale = 1;
                        
                        if (img.width > MAX_WIDTH) {
                            scale = MAX_WIDTH / img.width;
                        }
                        
                        canvas.width = img.width * scale; 
                        canvas.height = img.height * scale;
                        
                        const ctx = canvas.getContext('2d'); 
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        resolve({ 
                            name: file.name, 
                            mimeType: 'image/jpeg', 
                            base64: canvas.toDataURL('image/jpeg', 0.45).split(',')[1] 
                        });
                    };
                };
            });
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                
                reader.onload = () => resolve({ 
                    name: file.name, 
                    mimeType: file.type, 
                    base64: reader.result.split(',')[1] 
                });
                
                reader.onerror = error => reject(error);
            });
        }

        async function submitStage(stageNum) {
            const btn = document.getElementById(`submitBtn_${stageNum}`); 
            const statusLabel = document.getElementById(`status_${stageNum}`);
            
            let isCod = currentActiveOrder.paymentMode && currentActiveOrder.paymentMode.toUpperCase().includes('COD');

            let payload = { 
                action: 'updateStage', 
                orderId: currentActiveOrder.orderId, 
                stage: stageNum, 
                files: [], 
                isNoResponse: false, 
                isWhatsAppOnly: false, 
                partialStock: null, 
                staffName: currentUserName 
            };
            
            const noRespCheckbox = document.getElementById(`noResponse_${stageNum}`);
            if (noRespCheckbox && noRespCheckbox.checked) {
                payload.isNoResponse = true; 
            }
            
            if (stageNum === 7) {
                let runner = document.getElementById('runnerSelect').value;
                if (runner === "Others") {
                    runner = document.getElementById('runnerOther').value;
                }
                
                let transport = document.getElementById('transportSelect').value;
                if (transport === "Others") {
                    transport = document.getElementById('transportOther').value;
                }

                if (!runner || !transport) {
                    alert("Accountability requires data! Select both a Delivery Person and a Transport partner.");
                    if(btn) { 
                        btn.disabled = false; 
                        btn.innerText = "Allocate Logistics & Proceed"; 
                    }
                    return;
                }
                
                payload.actionText = `Runner: ${runner} | Transport: ${transport}`;
            }
            
            if (stageNum !== 1) {
                let fileRequired = true;
                
                if (payload.isNoResponse || stageNum === 10 || stageNum === 7 || stageNum === 3 || (stageNum === 8 && !isCod)) {
                    fileRequired = false; 
                }

                if (fileRequired && queuedFiles.length === 0) {
                    if (stageNum === 8 && isCod) {
                        alert("For COD Orders, Call Recording is MANDATORY."); 
                    } else {
                        alert("A file proof (Screenshot/Photo) is mandatory."); 
                    }
                    return; 
                }
                
                if (!fileRequired && queuedFiles.length === 0 && (stageNum === 3 || stageNum === 8)) {
                    payload.isWhatsAppOnly = true; 
                }
                
                if (btn) { 
                    btn.innerText = "Processing & Transmitting..."; 
                    btn.disabled = true; 
                }
                
                for (let i = 0; i < queuedFiles.length; i++) {
                    let f = queuedFiles[i];
                    if (f.type.startsWith('image/')) {
                        payload.files.push(await compressImage(f)); 
                    } else {
                        payload.files.push(await getBase64(f)); 
                    }
                }
                
                if (stageNum === 10) { 
                    const rating = document.getElementById('ratingInput').value;
                    if (!rating) { 
                        alert("Customer Rating is mandatory."); 
                        if(btn) { 
                            btn.disabled = false; 
                            btn.innerText = "Execute & Proceed"; 
                        } 
                        return; 
                    }
                    payload.rating = rating;
                }

                if (stageNum === 4) {
                    let processed = []; 
                    let short = [];
                    
                    currentActiveOrder.items.forEach((item, idx) => {
                        let chk = document.getElementById(`chk_item_${idx}`); 
                        let qtyInput = document.getElementById(`qty_item_${idx}`);
                        
                        if (chk && qtyInput) {
                            let isChecked = chk.checked; 
                            let userQty = parseInt(qtyInput.value) || 0; 
                            let origQty = parseInt(item.qty);
                            
                            if (isChecked && userQty > 0) { 
                                processed.push({name: item.name, qty: userQty}); 
                                if (userQty < origQty) {
                                    short.push({name: item.name, qty: origQty - userQty}); 
                                }
                            } else {
                                short.push({name: item.name, qty: origQty}); 
                            }
                        }
                    });
                    
                    if (processed.length === 0) { 
                        alert("You must dispatch at least one item."); 
                        if(btn) { 
                            btn.disabled = false; 
                            btn.innerText = "Execute & Proceed"; 
                        } 
                        return; 
                    }
                    
                    if (short.length > 0) {
                        payload.partialStock = { processedItems: processed, shortItems: short }; 
                    }
                }
            } else if (btn) { 
                btn.innerText = "Locking Process..."; 
                btn.disabled = true; 
            }
            
            if (statusLabel) { 
                statusLabel.innerText = "📡 Uplinking Data..."; 
                statusLabel.className = "text-[10px] font-black tracking-widest mt-3 text-indigo-400 block animate-pulse text-center uppercase"; 
                statusLabel.classList.remove('hidden'); 
            }

            try {
                const res = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(payload) 
                });
                
                const data = await res.json();
                
                if (data.status === 'success') { 
                    if (btn) {
                        btn.innerText = "Transmission Successful ✓"; 
                    }
                    queuedFiles = []; 
                    
                    if (data.splitOrderId) { 
                        alert(`✂️ SPLIT ORDER CREATED!\nNew ID: ${data.splitOrderId}`); 
                        showNotification("SPLIT ORDER CREATED", `New ID: ${data.splitOrderId}`); 
                    }
                    
                    fetchOrders(true); 
                    closeModal();
                } else {
                    throw new Error(data.message); 
                }
            } catch (err) {
                if (statusLabel) { 
                    statusLabel.innerText = "❌ Sync Failed. Network Drop."; 
                    statusLabel.className = "text-[10px] font-black mt-3 text-pink-500 block text-center uppercase"; 
                }
                if (btn) { 
                    btn.innerText = "Retry Transmission (Tap Again)"; 
                    btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500'); 
                    btn.classList.add('bg-pink-600', 'hover:bg-pink-500'); 
                    btn.disabled = false; 
                }
            }
        }
    </script>
