                    method: 'POST', 
                    body: JSON.stringify({action: 'getTrackingData', orderId: '<?= trackOrderId ?>'})
                })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('trackingLoader').style.display = 'none';
                    if(data.status === 'success') {
                        let html = '';
                        const customerStages = [
                            "Order Placed", 
                            "Confirmed & Processing", 
                            "Packed & Ready", 
                            "Invoiced", 
                            "Dispatched", 
                            "Out for Delivery", 
                            "Delivered Successfully"
                        ];
                        
                        // Map internal 9 stages to 7 customer stages
                        let mappedStage = Math.min(Math.floor(data.data.completedStages / 1.3), 6);
                        
                        customerStages.forEach((stageName, idx) => {
                            let isCompleted = idx <= mappedStage;
                            let isActive = idx === mappedStage;
                            let color = isCompleted ? 'bg-emerald-500 shadow-[0_0_10px_#10b981]' : 'bg-slate-700';
                            let textColor = isCompleted ? 'text-white' : 'text-slate-500';
                            let icon = isCompleted ? '✓' : '';

                            html += `

                                    <div class="flex items-center justify-center w-8 h-8 rounded-full border-4 border-[#0B1121] ${color} text-white font-black text-xs z-10 shrink-0">

                                        <h3 class="font-bold text-sm ${textColor}">${stageName}</h3>
                                    </div>
                                </div>
                            `;
                        });
                        
                        document.getElementById('trackingTimeline').innerHTML = html;
                        document.getElementById('trackingTimeline').classList.remove('hidden');
                    } else {
                        document.getElementById('trackingError').innerText = data.message || "Invalid Tracking ID";
                        document.getElementById('trackingError').classList.remove('hidden');
                    }
                }).catch(err => {
                    document.getElementById('trackingLoader').style.display = 'none';
                    document.getElementById('trackingError').innerText = "Network error while fetching tracking data.";
                    document.getElementById('trackingError').classList.remove('hidden');
                });
            }

        // ==========================================
        // SMART DATE PARSER & TIME HELPERS
        // ==========================================
        function parseCustomDate(dateStr) {
            if (!dateStr) return new Date();
            let d = new Date(dateStr);
            if (!isNaN(d)) return d;

            let parts = String(dateStr).split(' ');
            if (parts.length >= 1) {
                let dateParts = parts[0].split(/[\/\-]/);
                if (dateParts.length === 3) {
                    let day = parseInt(dateParts[0]);
                    let month = parseInt(dateParts[1]) - 1;
                    let year = parseInt(dateParts[2]);
                    
                    if (year < 100) year += 2000;
                    
                    let hours = 0, mins = 0, secs = 0;
                    if (parts.length >= 2) {
                        let timeParts = parts[1].split(':');
                        hours = parseInt(timeParts[0]) || 0;
                        mins = parseInt(timeParts[1]) || 0;
                        secs = parseInt(timeParts[2]) || 0;
                    }
                    return new Date(year, month, day, hours, mins, secs);
                }
            }
            return new Date();
        }

        function formatExactDate(dateString) {
            if (!dateString) return "";
            const d = parseCustomDate(dateString);
            
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            
            let hours = d.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const mins = String(d.getMinutes()).padStart(2, '0');
            
            return `Received: ${day}/${month}/${year} ${hours}:${mins} ${ampm}`;
        }

        function getTimeAgoUI(dateString) {
            if (!dateString) return { text: "", color: "text-slate-400", isSLAWarning: false };
            const orderDate = parseCustomDate(dateString);
            const diffInMs = new Date() - orderDate;
            
            if (diffInMs < 0) return { text: "Just now", color: "text-emerald-400", isSLAWarning: false };
            
            const diffInHrs = Math.floor(diffInMs / (1000 * 60 * 60));
            const diffInMins = Math.floor((diffInMs % (1000 * 60 * 60)) / (1000 * 60));
            
            let color = 'text-emerald-400';
            let isSLAWarning = false;
            
            // NEW FEATURE: SLA Breach Predictor Logic
            if (diffInHrs >= 48) {
                color = 'text-pink-500';
            }
            else if (diffInHrs >= 46) { 
                color = 'text-yellow-400'; 
                isSLAWarning = true; 
            }
            else if (diffInHrs >= 4) {
                color = 'text-orange-400';
            }

            if (diffInHrs > 48) return { text: `${Math.floor(diffInHrs/24)}d ago`, color: color, isSLAWarning };
            if (diffInHrs > 0) return { text: `${diffInHrs}h ${diffInMins}m ago`, color: color, isSLAWarning };
            if (diffInMins > 0) return { text: `${diffInMins}m ago`, color: color, isSLAWarning };
            return { text: `Just now`, color: color, isSLAWarning };
        }

        function makeDirectDriveLink(url) {
            let match = url.match(/\/d\/(.*?)\//);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        async function fetchOrders(isSilent = false) {

                    method: 'POST', 
                    body: JSON.stringify({ action: 'getOrders' })

                const response = await res.json();
                
                if (response.status === 'success') {
                    
                    // NEW FEATURE: Receive Settings Template from Backend
                    if(response.settings) {
                        window.appSettings = response.settings;
                    }

                    if (response.data.length > 0 && latestOrderTimestamp !== null) {

                    window.appData.rawArray = response.data;

            activeDateRange = range;

        function applyDateFilter() {
            let now = new Date(); 
            now.setHours(0,0,0,0);
            
            if (activeDateRange === 'split') {
                filteredData = window.appData.rawArray.filter(o => String(o.orderId).toUpperCase().includes('SPLIT'));
            } else {
                filteredData = window.appData.rawArray.filter(o => {
                    let d = parseCustomDate(o.date); 
                    d.setHours(0,0,0,0);
                    
                    if (activeDateRange === 'today') {
                        return d.getTime() === now.getTime();
                    }
                    if (activeDateRange === '7d') {
                        return (now - d) / (1000*60*60*24) <= 7;
                    }
                    if (activeDateRange === '30d') {
                        return (now - d) / (1000*60*60*24) <= 30;
                    }
                    if (activeDateRange === 'custom') {
                        let customVal = document.getElementById('customDateFilter').value;
                        if(!customVal) return true;
                        return new Date(customVal).getTime() === d.getTime();
                    }
                    return true; 
                });
            }
            
            renderMdoDashboard(); 
            renderPipeline();
        }

            pendingOrders.forEach(o => { 
                if (o.completedStages < 9) {
                    stageCounts[o.completedStages]++; 
                }
                if (o.completedStages < 4) { // Pre-dispatch orders are mergeable
                    shopPendingCount[o.shopName] = (shopPendingCount[o.shopName] || 0) + 1;
                }
            });

            let filterHtml = `
                <div 
                    onclick="setStageFilter(null)"

            STAGE_NAMES.forEach((name, idx) => {
                let isActive = activeStageFilter === idx;

                let filterName = name.split(' (')[0];

        // ==========================================
        // UI INTERACTIONS & FILE SELECTION
        // ==========================================
        function handleFileSelection(inputElement, stageNum) {
            const newFiles = Array.from(inputElement.files);
            queuedFiles = queuedFiles.concat(newFiles);
            
            const statusLabel = document.getElementById(`fileStatusText_${stageNum}`);
            const clearBtn = document.getElementById(`clearFilesBtn_${stageNum}`);
            const container = document.getElementById(`fileStatusContainer_${stageNum}`);
            const previewBox = document.getElementById(`previewBox_${stageNum}`);
            
            if (queuedFiles.length > 0) {
                statusLabel.innerText = `✓ ${queuedFiles.length} File(s) Ready`;
                statusLabel.classList.remove('hidden'); 
                
                if (clearBtn) {
                    clearBtn.classList.remove('hidden'); 
                }
                
                if (container) {
                    container.classList.remove('hidden');
                }
                
                if (previewBox) {
                    previewBox.innerHTML = ''; 
                    previewBox.classList.remove('hidden');
                    
                    queuedFiles.forEach(file => {
                        if (file.type.startsWith('audio/')) { 
                            previewBox.innerHTML += `
                                <div class="w-12 h-12 bg-indigo-900/50 flex flex-col items-center justify-center rounded border border-indigo-500 text-[8px] text-indigo-300 font-bold p-1 overflow-hidden shadow-inner">
                                    🎤<br/>Audio
                                </div>
                            `; 
                        } else {
                            const reader = new FileReader();
                            reader.onload = function(e) { 
                                previewBox.innerHTML += `
                                    <img src="${e.target.result}" class="w-12 h-12 object-cover rounded border border-slate-600 shadow-sm">
                                `; 
                            }
                            reader.readAsDataURL(file);
                        }
                    });
                }
            }
        }
        
        function clearQueuedFiles(stageNum) {
            queuedFiles = [];
            
            const statusLabel = document.getElementById(`fileStatusText_${stageNum}`);
            const clearBtn = document.getElementById(`clearFilesBtn_${stageNum}`);
            const container = document.getElementById(`fileStatusContainer_${stageNum}`);
            const previewBox = document.getElementById(`previewBox_${stageNum}`);
            
            if(statusLabel) {
                statusLabel.classList.add('hidden'); 
            }
            if(clearBtn) {
                clearBtn.classList.add('hidden'); 
            }
            if(container) {
                container.classList.add('hidden');
            }
            if(previewBox) { 
                previewBox.innerHTML = ''; 
                previewBox.classList.add('hidden'); 
            }
        }

        // ==========================================
        // NEW FEATURE: Client-Side Tally SO CSV Generator
        // ==========================================
        function generateTallyCSV(orderId) {
            const order = window.appData.orders[orderId];
            if(!order) return;
            
            // Standard Tally Sales Order CSV format headers
            let csvContent = "Date,Voucher Type,Voucher Number,Party Name,Item Name,Quantity,Rate,Amount\n";
            
            let formattedDate = parseCustomDate(order.date).toLocaleDateString('en-GB'); // DD/MM/YYYY
            
            order.items.forEach(item => {
                // Rate and Amount left 0 by default to allow Tally to auto-fill or remain 0 as per SO standards
                csvContent += `${formattedDate},Sales Order,${order.orderId},"${order.shopName}","${item.name}",${item.qty},0,0\n`;
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Tally_SO_${order.orderId}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showNotification("Tally SO Exported", `File downloaded for ${order.orderId}. Ready for import.`);
        }

        // ==========================================
        // DATA COMPRESSION & UPLOAD PROTOCOLS
        // ==========================================
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                
                reader.onload = (event) => {
                    const img = new Image(); 
                    img.src = event.target.result;
                    
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); 
                        const MAX_WIDTH = 800; 
                        let scale = 1;
                        
                        if (img.width > MAX_WIDTH) {
                            scale = MAX_WIDTH / img.width;
                        }
                        
                        canvas.width = img.width * scale; 
                        canvas.height = img.height * scale;
                        
                        const ctx = canvas.getContext('2d'); 
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6); 
                        
                        resolve({ 
                            name: file.name, 
                            mimeType: 'image/jpeg', 
                            base64: dataUrl.split(',')[1] 
                        });
                    };
                };
            });
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                
                reader.onload = () => resolve({ 
                    name: file.name, 
                    mimeType: file.type, 
                    base64: reader.result.split(',')[1] 
                });
                
                reader.onerror = error => reject(error);
            });
        }

        // ==========================================
        // SUBMIT STAGE
        // ==========================================
        async function submitStage(stageNum) {
            const btn = document.getElementById(`submitBtn_${stageNum}`);
            const statusLabel = document.getElementById(`status_${stageNum}`);
            
            let isCod = currentActiveOrder.paymentMode && currentActiveOrder.paymentMode.toUpperCase().includes('COD');

            // NEW FEATURE: Added staffName to payload for Leaderboard tracking
            let payload = { 
                action: 'updateStage', 
                orderId: currentActiveOrder.orderId, 
                stage: stageNum, 
                files: [], 
                isNoResponse: false, 
                isWhatsAppOnly: false, 
                partialStock: null,
                staffName: currentUserName 
            };
            
            const noRespCheckbox = document.getElementById(`noResponse_${stageNum}`);
            if (noRespCheckbox && noRespCheckbox.checked) { 
                payload.isNoResponse = true; 
            }
            
            if (stageNum !== 1) {
                
                let fileRequired = true;
                
                if (payload.isNoResponse || stageNum === 9 || stageNum === 3 || (stageNum === 7 && !isCod)) { 
                    fileRequired = false; 
                }

                if (fileRequired && queuedFiles.length === 0) {
                    if (stageNum === 7 && isCod) { 
                        alert("For COD Orders, Call Recording (Audio File) is MANDATORY to proceed. Or check 'Dealer Didn't Respond'."); 
                    } else { 
                        alert("A file proof (Screenshot/Photo) is mandatory OR check 'Dealer Didn't Respond'."); 
                    }
                    return; 
                }
                
                if (!fileRequired && queuedFiles.length === 0) { 
                    payload.isWhatsAppOnly = true; 
                }
                
                if (btn) { 
                    btn.innerText = "Processing & Transmitting..."; 
                    btn.disabled = true; 
                }
                
                for (let i = 0; i < queuedFiles.length; i++) {
                    let f = queuedFiles[i];
                    if (f.type.startsWith('image/')) { 
                        payload.files.push(await compressImage(f)); 
                    } else { 
                        payload.files.push(await getBase64(f)); 
                    }
                }
                
                if (stageNum === 9) {
                    const rating = document.getElementById('ratingInput').value;
                    if (!rating) { 
                        alert("Customer Rating is mandatory."); 
                        if(btn) { 
                            btn.disabled = false; 
                            btn.innerText = "Execute & Proceed"; 
                        } 
                        return; 
                    }
                    payload.rating = rating;
                }

                if (stageNum === 4) {
                    let processed = []; 
                    let short = [];
                    
                    currentActiveOrder.items.forEach((item, idx) => {
                        let chk = document.getElementById(`chk_item_${idx}`); 
                        let qtyInput = document.getElementById(`qty_item_${idx}`);
                        
                        if (chk && qtyInput) {
                            let isChecked = chk.checked; 
                            let userQty = parseInt(qtyInput.value) || 0; 
                            let origQty = parseInt(item.qty);
                            
                            if (isChecked && userQty > 0) { 
                                processed.push({name: item.name, qty: userQty}); 
                                if (userQty < origQty) { 
                                    short.push({name: item.name, qty: origQty - userQty}); 
                                } 
                            } else { 
                                short.push({name: item.name, qty: origQty}); 
                            }
                        }
                    });
                    
                    if (processed.length === 0) { 
                        alert("You must dispatch at least one item."); 
                        if(btn) { 
                            btn.disabled = false; 
                            btn.innerText = "Execute & Proceed"; 
                        } 
                        return; 
                    }
                    
                    if (short.length > 0) { 
                        payload.partialStock = { processedItems: processed, shortItems: short }; 
                    }
                }
            } else if (btn) { 
                btn.innerText = "Locking Process..."; 
                btn.disabled = true; 
            }
            
            if (statusLabel) { 
                statusLabel.innerText = "📡 Uplinking Data to Control Tower..."; 
                statusLabel.className = "text-[10px] font-black tracking-widest mt-3 text-indigo-400 block animate-pulse text-center uppercase"; 
                statusLabel.classList.remove('hidden'); 
            }

            try {
                const res = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(payload) 
                });
                
                const data = await res.json();
                
                if (data.status === 'success') { 
                    if (btn) { 
                        btn.innerText = "Transmission Successful ✓"; 
                    } 
                    queuedFiles = []; 
                    
                    if (data.splitOrderId) {
                        alert(`✂️ SPLIT ORDER CREATED SUCCESSFULLY!\n\nNew Order ID: ${data.splitOrderId}\n\nThe remaining short stock has been automatically shifted to this new order in the database.`);
                        showNotification("SPLIT ORDER CREATED", `New ID: ${data.splitOrderId}`);
                    }
                    
                    fetchOrders(true); 
                } else { 
                    throw new Error(data.message); 
                }
            } catch (err) {
                // NEW FEATURE: One-Tap Retry for Failed Uploads
                if (statusLabel) { 
                    statusLabel.innerText = "❌ Sync Failed. Network Dropped."; 
                    statusLabel.className = "text-[10px] font-black mt-3 text-pink-500 block text-center uppercase"; 
                }
                if (btn) { 
                    btn.innerText = "Retry Transmission (Tap Again)"; 
                    btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
                    btn.classList.add('bg-pink-600', 'hover:bg-pink-500'); // Changes color to indicate retry state
                    btn.disabled = false; 
                }
            }
        }
